id = "google-books"
name = "Google Books"
version = "0.1.0"
api_version = 1
author = "FerroLibri"
homepage = "https://github.com/yevkavaliou/ferrolibri/tree/main/examples/plugins/google-books"
license = "MIT"
description = "Searches the Google Books catalog (Books API v1) by title, author or ISBN. Shows the book's data and a link to its page; it does not offer downloads."
provides = ["search"]
content = ["metadata"]
search_hint = "Search by title, author or ISBN"

[network]
# The API, and the covers (books.google.com/books/content).
domains = ["www.googleapis.com", "books.google.com"]

[[settings]]
key = "base_url"
type = "url"
label = "API address"
network = true
default = "https://www.googleapis.com"

[[settings]]
key = "api_key"
type = "string"
label = "API key (optional)"
