id = "mock-library"
name = "Mock Library"
version = "0.1.0"
api_version = 1
author = "FerroLibri"
homepage = "https://github.com/yevkavaliou/ferrolibri/tree/main/examples/plugins/mock-library"
license = "MIT"
description = "A test source for checking the app. It makes no network requests: every search answers at once with the same made-up books, and the queries !empty, !error, !invalid and a few more produce failures. Its download addresses are on mock.invalid, which never resolves."
provides = ["search"]
content = ["metadata"]
search_hint = "Any text gives the same books; !empty, !error, !invalid, !max… give edge cases"

[network]
# Only for the addresses resolveDownload returns: mock.invalid (RFC 2606) never resolves, so a
# download fails at once with a DNS error instead of reaching a real site.
domains = ["mock.invalid"]

[[settings]]
key = "per_page"
type = "choice"
label = "Results per page"
options = ["10", "20", "50"]
default = "20"

[[settings]]
key = "with_offers"
type = "bool"
label = "Offer files for download"
default = true

[[settings]]
key = "extra_tag"
type = "string"
label = "Tag added to every result"
