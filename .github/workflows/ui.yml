name: iced UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux window and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan1 libvulkan-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: iced-ui
      - name: Build, lint and test UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          & ./scripts/check-ui.ps1 *>&1 | Tee-Object -FilePath target/ui.log
          if ($LASTEXITCODE -ne 0) { throw 'UI checks failed' }
      - name: Release build of the default workspace
        shell: pwsh
        run: |
          & cargo build --release --locked *>&1 | Tee-Object -FilePath target/release-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Save verification log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ matrix.os }}
          path: |
            target/ui.log
            target/release-build.log
