[package]
name = "ferrolibri-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Plugins for FerroLibri — contract, HTTP layer and the QuickJS sandbox that runs them."

[lib]
path = "src/lib.rs"

[features]
# The scriptable local HTTP server and the OPDS catalog stand-in (`ferrolibri_plugins::testing`),
# for the tests of this crate's dependants. The crate's own tests always have it.
test-support = []

[dependencies]
ferrolibri-core = { path = "../ferrolibri-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
semver = "1.0.27"
# The plugin runtime (D1). `std` is the default feature set; nothing else is needed.
rquickjs = "0.14"
# `host.html.select` and `host.xml.parse` (D3); the same pin as the core.
kuchikiki = "=0.8.8-speedreader"
roxmltree = { workspace = true }
log = "0.4"
url = "2"
# Where the plugins and their settings live (D11), and the SHA-256 of an installed script.
dirs = { workspace = true }
sha2 = "0.10"
# Only to recognise TLS failures: `ureq` hands them over as a bare `rustls::Error` in an `io::Error`.
rustls = { version = "0.23", default-features = false, features = ["std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
# Turns `test-support` on for this crate's integration tests.
ferrolibri-plugins = { path = ".", features = ["test-support"] }
tempfile = "3"
