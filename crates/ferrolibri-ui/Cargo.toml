[package]
name = "ferrolibri-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native iced desktop client for FerroLibri"
build = "build.rs"
default-run = "ferrolibri-gui"

# The TUI keeps `ferrolibri`; the graphical client is `ferrolibri-gui`, the name the
# earlier Tauri client used, so existing instructions stay valid.
[[bin]]
name = "ferrolibri-gui"
path = "src/main.rs"

[dependencies]
ferrolibri-core = { path = "../ferrolibri-core" }
ferrolibri-plugins = { path = "../ferrolibri-plugins" }
iced = { version = "0.14", features = ["image", "svg", "tokio", "advanced", "lazy"] }
env_logger = "0.11"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "6"
sha2 = "0.10"
log = "0.4"

[dev-dependencies]
# The scriptable local server and the OPDS stand-in, for the tests that run a real plugin.
ferrolibri-plugins = { path = "../ferrolibri-plugins", features = ["test-support"] }
tempfile = "3"
iced_runtime = "0.14"
iced_test = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
window-vibrancy = "0.8"

[build-dependencies]
winresource = "0.1"
