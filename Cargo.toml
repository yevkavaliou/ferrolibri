[workspace]
resolver = "2"
members = [
    "crates/ferrolibri",
    "crates/ferrolibri-core",
    "crates/ferrolibri-ui",
    "crates/ferrolibri-plugins",
]
default-members = ["crates/ferrolibri-core", "crates/ferrolibri", "crates/ferrolibri-ui", "crates/ferrolibri-plugins"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/yevkavaliou/ferrolibri"
homepage = "https://github.com/yevkavaliou/ferrolibri"
authors = ["Yauheni Kavaliou", "Leonardo Migliorelli"]
description = "A lightweight replacement for Calibre — browse your library and transfer books to your e-reader."
keywords = ["calibre", "ebook", "kindle", "kobo", "ereader"]
categories = ["command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
roxmltree = "0.21"

# Two small patches to iced 0.14 let Windows present through DirectComposition
# (transparent window + acrylic). See vendor/README.md.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
iced_winit = { path = "vendor/iced_winit" }
